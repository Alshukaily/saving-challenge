version: '3.8'

services:
  saving-challenge:
    image: ghcr.io/alshukaily/saving-challenge:latest
    container_name: saving_challenge_app
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_PATH=/app/data/saving_challenge.sqlite
      - JWT_SECRET=local-network-saving-challenge-secret-key-2026
    volumes:
      - /volume1/docker/saving-challenge:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/auth/me', (res) => process.exit(res.statusCode < 500 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s
